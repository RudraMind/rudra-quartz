name: Deploy to GitHub Pages
on:
  repository_dispatch:
    types: [vault-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Load vault SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VAULT_DEPLOY_KEY }}

      - name: Add github.com to known hosts
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone vault wiki content
        run: |
          git clone git@github.com:RudraMind/rudra-vault.git /tmp/vault
          # Markdown-only, no symlink traversal, no binary leakage
          rsync -r --include="*/" --include="*.md" --exclude="*" /tmp/vault/wiki/ content/
          cp /tmp/vault/meta/index.md content/index.md
          rm -rf /tmp/vault

      - name: Remove SSH key before build steps
        run: ssh-add -D
        if: always()

      - name: Sanitize frontmatter wikilinks
        run: |
          # [[pagename]] in YAML frontmatter is invalid YAML — strip brackets, keep text
          find content/ -name "*.md" -exec sed -i '/^---$/,/^---$/ s/\[\[\([^]]*\)\]\]/\1/g' {} \;

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: ${{ runner.os }}-plugins-

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Build Quartz
        run: npx quartz build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
